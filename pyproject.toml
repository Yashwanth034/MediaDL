[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mediadl"
version = "1.0.1"
description = "Clean, resilient terminal downloader for single videos, playlists, and channels."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MediaDL contributors"}]
dependencies = [
  "platformdirs>=4.2,<5",
  "rich>=13.7,<15",
  "secretstorage>=3.3,<4; sys_platform == 'linux'",
  "typer>=0.12,<1",
  "yt-dlp[default]>=2026.8.19,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
package = [
  "pyinstaller>=6.10,<7",
]

[project.scripts]
mdl = "mediadl.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mediadl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
